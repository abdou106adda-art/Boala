
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💗</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #ffe1ec, #f4d9ff, #fff0f5);
      overflow: hidden;
    }

    .card {
      text-align: center;
      padding: 45px 30px;
      width: 85%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 30px;
      box-shadow: 0 15px 45px rgba(190, 100, 150, 0.18);
      animation: appear 1.2s ease;
    }

    .heart {
      font-size: 65px;
      margin-bottom: 20px;
      animation: beat 1.5s infinite;
    }

    h1 {
      color: #d84c85;
      font-size: clamp(28px, 8vw, 40px);
      margin-bottom: 15px;
    }

    p {
      color: #a66b91;
      font-size: 17px;
    }

    .sparkle {
      position: absolute;
      font-size: 25px;
      animation: float 5s infinite ease-in-out;
      opacity: 0.7;
    }

    .s1 { top: 15%; left: 15%; }
    .s2 { top: 25%; right: 12%; animation-delay: 1s; }
    .s3 { bottom: 15%; left: 20%; animation-delay: 2s; }
    .s4 { bottom: 22%; right: 15%; animation-delay: 1.5s; }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(12deg); }
    }
  </style>
</head>

<body>
  <div class="sparkle s1">✨</div>
  <div class="sparkle s2">💕</div>
  <div class="sparkle s3">🌸</div>
  <div class="sparkle s4">✨</div>

  <div class="card">
    <div class="heart">💗</div>
    <h1>البوالة ديالي 🥹</h1>
    <p>واحد القلب صغير ليك ❤️</p>
  </div>
</body>
</html>
